<!DOCTYPE html>

<html data-screen="recording" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Burrow — Live Recording</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FFFFFF;
      color: #1A1A1A;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .hand-lettered {
      font-family: 'Caveat', cursive;
    }
    .wobble-pulse {
      animation: wobble 3s ease-in-out infinite alternate;
    }
    @keyframes wobble {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.02) rotate(1.2deg); }
      100% { transform: scale(0.99) rotate(-1deg); }
    }
    .sound-drift-1 {
      animation: drift1 2.4s ease-in-out infinite alternate;
    }
    .sound-drift-2 {
      animation: drift2 2.8s ease-in-out infinite alternate 0.4s;
    }
    @keyframes drift1 {
      0% { transform: translateY(0) scaleY(0.95); opacity: 0.85; }
      100% { transform: translateY(-2px) scaleY(1.08); opacity: 1; }
    }
    @keyframes drift2 {
      0% { transform: translateY(0) scaleY(1.05); opacity: 0.75; }
      100% { transform: translateY(3px) scaleY(0.9); opacity: 0.95; }
    }
    .marker-swipe {
      position: absolute;
      left: -6px;
      right: -6px;
      bottom: 2px;
      height: 18px;
      background-color: #FFE45C;
      border-radius: 4px;
      transform: rotate(-1.2deg);
      z-index: 0;
    }
  </style>

<body class="bg-white text-[#1A1A1A] min-h-screen flex justify-center selection:bg-[#FFE45C]">
<!-- Mobile phone frame (Samsung Galaxy Z Fold cover screen, 412px portrait) -->
<main class="w-full max-w-[412px] min-h-screen flex flex-col justify-between px-6 pt-3 pb-8 relative overflow-hidden bg-white">
<!-- Top System / Status Bar -->
<header class="w-full">
<div class="flex items-center justify-between text-xs text-[#1A1A1A] font-medium tracking-tight pt-1 pb-4">
<span>10:02</span>
<div class="flex items-center space-x-1.5">
<!-- Hand-drawn recording live pulse dot -->
<span class="inline-block w-2 h-2 rounded-full bg-[#DC2626] animate-pulse mr-1"></span>
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
<path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
<path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
<line x1="12" x2="12.01" y1="20" y2="20"></line>
</svg>
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewbox="0 0 24 24">
<rect height="12" rx="2" width="18" x="2" y="6"></rect>
<line x1="22" x2="22" y1="11" y2="13"></line>
<line stroke-width="2.5" x1="6" x2="6" y1="10" y2="14"></line>
<line stroke-width="2.5" x1="10" x2="10" y1="10" y2="14"></line>
<line stroke-width="2.5" x1="14" x2="14" y1="10" y2="14"></line>
</svg>
</div>
</div>
<!-- Burrow Top Navigation Header (Full screen mode: subtle dismiss / minimal lock) -->
<div class="flex items-center justify-between mt-2">
<div class="flex items-center gap-1.5">
<span class="hand-lettered text-2xl font-bold tracking-tight">burrow.</span>
<!-- Hand-drawn lock doodle -->
<svg class="w-3.5 h-3.5 text-[#1A1A1A] ml-0.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewbox="0 0 16 16">
<rect height="8" rx="1.5" width="10" x="3" y="6.5"></rect>
<path d="M5.5 6.5V4.5C5.5 3 6.6 2 8 2C9.4 2 10.5 3 10.5 4.5V6.5"></path>
<circle cx="8" cy="10.5" fill="currentColor" r="1"></circle>
</svg>
</div>

<path d="M6 9l6 6 6-6"></path>
</svg>
</button>
</div>
<!-- Meeting Title & Participants -->
<div class="mt-8 text-center px-4">
<div class="relative inline-block">
<span class="marker-swipe"></span>
<h1 class="hand-lettered text-[34px] leading-tight font-bold text-[#1A1A1A] relative z-10 px-1">
            Q3 roadmap sync
          </h1>
</div>
<p class="text-[13px] text-[#6B6B6B] mt-1.5 flex items-center justify-center gap-1.5">
<span>Priya Shah, Marco Rossi, Sam</span>

<style>
  html, body { scrollbar-width: none; overflow-x: hidden; max-width: 100%; }
  ::-webkit-scrollbar { display: none; }
  .marker-highlight { isolation: isolate; }

  [data-act="toggle"].bw-flip, [data-act="flip"].bw-flip { filter: invert(1); transform: scaleX(-1); transition: filter .2s, transform .25s cubic-bezier(.34,1.56,.64,1); }
  [data-act="toggle"], [data-act="flip"] { transition: filter .2s, transform .25s cubic-bezier(.34,1.56,.64,1); }
  .bw-done { text-decoration: line-through; text-decoration-thickness: 2px; opacity: .45; }
  .bw-done svg, .bw-done [class*="border"] { background: #1A1A1A; border-radius: 4px; }
  [data-act="moment-tile"] { transition: opacity .25s, filter .25s, transform .2s; }
  [data-act="moment-tile"].bw-letgo { opacity: .35 !important; filter: grayscale(.6); }
  [data-act="moment-tile"].bw-keep { opacity: 1 !important; filter: none; }
  [data-act="moment-tile"].bw-keep img { filter: none !important; }
  [data-act="reveal"].bw-reveal img { filter: none !important; }
  [data-act="reveal"].bw-reveal [class*="backdrop"], [data-act="reveal"].bw-reveal svg { opacity: 0; }
  [data-act="reveal"] img { transition: filter .3s; }
  [data-act="radio"].bw-picked { background: #FFF6BF !important; border-color: #1A1A1A !important; }
  [data-act="radio"] { transition: background .15s; }
  [data-act="pick"] { transition: opacity .25s, transform .25s; }
  .bw-gone { opacity: 0; transform: translateY(-6px); transition: opacity .3s, transform .3s; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<script>
(function () {
  var SCREEN = document.documentElement.getAttribute('data-screen');
  function send(m) { m.burrow = 1; m.from = SCREEN; parent.postMessage(m, '*'); }
  window.bw = { send: send };
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-go],[data-back],[data-toast],[data-tab]');
    if (!el) return;
    e.preventDefault(); e.stopPropagation();
    if (el.dataset.act) { send({ act: el.dataset.act, path: pathOf(el) }); local(el.dataset.act, el); return; }
    if (el.dataset.tab) return send({ tab: el.dataset.tab });
    if (el.dataset.back !== undefined) return send({ back: 1 });
    if (el.dataset.go) return send({ go: el.dataset.go, replace: !!el.dataset.replace, tab: el.dataset.tabgo || null });
    if (el.dataset.toast) return send({ toast: el.dataset.toast });
  }, true);
  function pathOf(el) { var i = Array.prototype.indexOf.call(document.querySelectorAll('[data-act="' + el.dataset.act + '"]'), el); return i; }
  function local(act, el) {
    if (act === 'toggle' || act === 'flip') { el.classList.toggle('bw-flip'); }
    else if (act === 'switch') {
      var on = el.classList.contains('active'); el.classList.toggle('active', !on); el.classList.toggle('inactive', on); el.setAttribute('aria-checked', String(!on));
    }
    else if (act === 'check') { el.classList.toggle('bw-done'); }
    else if (act === 'radio') {
      document.querySelectorAll('[data-act="radio"]').forEach(function (r) { r.classList.remove('bw-picked'); r.style.background = 'transparent'; });
      el.classList.add('bw-picked');
    }
    else if (act === 'moment-tile') {
      var kept = el.classList.contains('bw-keep') || (!el.classList.contains('bw-letgo') && !/opacity-/.test(el.className));
      el.classList.toggle('bw-letgo', kept); el.classList.toggle('bw-keep', !kept);
      send({ act: 'moment-delta', d: kept ? 1 : -1 });
    }
    else if (act === 'reveal') {
      el.classList.add('bw-reveal'); clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('bw-reveal'); }, 4000);
    }
    else if (act === 'pick') {
      var cards = document.querySelectorAll('[data-act="pick"]');
      cards.forEach(function (c) { c.style.opacity = c === el ? '1' : '.55'; c.style.transform = c === el ? 'rotate(-1deg) scale(1.03)' : 'rotate(1.5deg)'; });
    }
    else if (act === 'hide-sheet') { var s = el.closest('[class*="fixed"],[class*="absolute"],section,div'); if (s) s.classList.add('bw-gone'); }
  }
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.burrowState) {

        document.querySelectorAll('[data-bind="' + k + '"]').forEach(function (n) { n.textContent = d.burrowState[k]; });
      });
      (d.hide || []).forEach(function (k) { document.querySelectorAll('[data-hide="' + k + '"]').forEach(function (n) { n.classList.add('bw-gone'); }); });
    }
    if (d.burrowEval === 'reset-scroll') window.scrollTo(0, 0);
  });
  send({ ready: 1 });
})();
</script>

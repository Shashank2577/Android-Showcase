<style>

  [data-act="radio"] { transition: background .15s; }

<script>
(function () {
  var SCREEN = document.documentElement.getAttribute('data-screen');

  window.bw = { send: send };
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-go],[data-back],[data-toast],[data-tab]');
    if (!el) return;
    e.preventDefault(); e.stopPropagation();
    if (el.dataset.act) { send({ act: el.dataset.act, path: pathOf(el) }); local(el.dataset.act, el); return; }
    if (el.dataset.tab) return send({ tab: el.dataset.tab });
    if (el.dataset.back !== undefined) return send({ back: 1 });

    if (el.dataset.toast) return send({ toast: el.dataset.toast });

  function pathOf(el) { var i = Array.prototype.indexOf.call(document.querySelectorAll('[data-act="' + el.dataset.act + '"]'), el); return i; }
  function local(act, el) {
    if (act === 'toggle' || act === 'flip') { el.classList.toggle('bw-flip'); }
    else if (act === 'switch') {
      var on = el.classList.contains('active'); el.classList.toggle('active', !on); el.classList.toggle('inactive', on); el.setAttribute('aria-checked', String(!on));

      el.classList.add('bw-picked');
    }
    else if (act === 'moment-tile') {
      var kept = el.classList.contains('bw-keep') || (!el.classList.contains('bw-letgo') && !/opacity-/.test(el.className));
      el.classList.toggle('bw-letgo', kept); el.classList.toggle('bw-keep', !kept);

    else if (act === 'reveal') {
      el.classList.add('bw-reveal'); clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('bw-reveal'); }, 4000);
    }
    else if (act === 'pick') {
      var cards = document.querySelectorAll('[data-act="pick"]');

  });

})();
</script>

      right: -4px;

      bottom: 8%;

      z-index: 1;
      border-radius: 4px 6px 3px 5px;
      transform: rotate(-0.8deg);

<style>
  html, body { scrollbar-width: none; overflow-x: hidden; max-width: 100%; }
  ::-webkit-scrollbar { display: none; }
  .marker-highlight { isolation: isolate; }
  [data-go], [data-back], [data-act], [data-toast], [data-tab] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  [data-act="toggle"].bw-flip, [data-act="flip"].bw-flip { filter: invert(1); transform: scaleX(-1); transition: filter .2s, transform .25s cubic-bezier(.34,1.56,.64,1); }
  [data-act="toggle"], [data-act="flip"] { transition: filter .2s, transform .25s cubic-bezier(.34,1.56,.64,1); }
  .bw-done { text-decoration: line-through; text-decoration-thickness: 2px; opacity: .45; }
  .bw-done svg, .bw-done [class*="border"] { background: #1A1A1A; border-radius: 4px; }
  [data-act="moment-tile"] { transition: opacity .25s, filter .25s, transform .2s; }
  [data-act="moment-tile"].bw-letgo { opacity: .35 !important; filter: grayscale(.6); }
  [data-act="moment-tile"].bw-keep { opacity: 1 !important; filter: none; }
  [data-act="moment-tile"].bw-keep img { filter: none !important; }
  [data-act="reveal"].bw-reveal img { filter: none !important; }
  [data-act="reveal"].bw-reveal [class*="backdrop"], [data-act="reveal"].bw-reveal svg { opacity: 0; }
  [data-act="reveal"] img { transition: filter .3s; }
  [data-act="radio"].bw-picked { background: #FFF6BF !important; border-color: #1A1A1A !important; }
  [data-act="radio"] { transition: background .15s; }
  [data-act="pick"] { transition: opacity .25s, transform .25s; }
  .bw-gone { opacity: 0; transform: translateY(-6px); transition: opacity .3s, transform .3s; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<script>
(function () {
  var SCREEN = document.documentElement.getAttribute('data-screen');
  function send(m) { m.burrow = 1; m.from = SCREEN; parent.postMessage(m, '*'); }
  window.bw = { send: send };
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-go],[data-back],[data-toast],[data-tab]');
    if (!el) return;
    e.preventDefault(); e.stopPropagation();
    if (el.dataset.act) { send({ act: el.dataset.act, path: pathOf(el) }); local(el.dataset.act, el); return; }
    if (el.dataset.tab) return send({ tab: el.dataset.tab });
    if (el.dataset.back !== undefined) return send({ back: 1 });
    if (el.dataset.go) return send({ go: el.dataset.go, replace: !!el.dataset.replace, tab: el.dataset.tabgo || null });
    if (el.dataset.toast) return send({ toast: el.dataset.toast });
  }, true);
  function pathOf(el) { var i = Array.prototype.indexOf.call(document.querySelectorAll('[data-act="' + el.dataset.act + '"]'), el); return i; }
  function local(act, el) {
    if (act === 'toggle' || act === 'flip') { el.classList.toggle('bw-flip'); }
    else if (act === 'switch') {
      var on = el.classList.contains('active'); el.classList.toggle('active', !on); el.classList.toggle('inactive', on); el.setAttribute('aria-checked', String(!on));
    }
    else if (act === 'check') { el.classList.toggle('bw-done'); }
    else if (act === 'radio') {
      document.querySelectorAll('[data-act="radio"]').forEach(function (r) { r.classList.remove('bw-picked'); r.style.background = 'transparent'; });
      el.classList.add('bw-picked');
    }
    else if (act === 'moment-tile') {
      var kept = el.classList.contains('bw-keep') || (!el.classList.contains('bw-letgo') && !/opacity-/.test(el.className));
      el.classList.toggle('bw-letgo', kept); el.classList.toggle('bw-keep', !kept);
      send({ act: 'moment-delta', d: kept ? 1 : -1 });
    }
    else if (act === 'reveal') {
      el.classList.add('bw-reveal'); clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('bw-reveal'); }, 4000);
    }
    else if (act === 'pick') {
      var cards = document.querySelectorAll('[data-act="pick"]');
      cards.forEach(function (c) { c.style.opacity = c === el ? '1' : '.55'; c.style.transform = c === el ? 'rotate(-1deg) scale(1.03)' : 'rotate(1.5deg)'; });
    }
    else if (act === 'hide-sheet') { var s = el.closest('[class*="fixed"],[class*="absolute"],section,div'); if (s) s.classList.add('bw-gone'); }
  }
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.burrowState) {
      Object.keys(d.burrowState).forEach(function (k) {
        document.querySelectorAll('[data-bind="' + k + '"]').forEach(function (n) { n.textContent = d.burrowState[k]; });
      });
      (d.hide || []).forEach(function (k) { document.querySelectorAll('[data-hide="' + k + '"]').forEach(function (n) { n.classList.add('bw-gone'); }); });
    }
    if (d.burrowEval === 'reset-scroll') window.scrollTo(0, 0);
  });
  send({ ready: 1 });
})();
</script>

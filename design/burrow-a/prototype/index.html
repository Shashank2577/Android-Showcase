<title>Burrow Hand-drawn Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: a quiet desk (journeys on the left) holding one phone; on a phone the prototype fills the screen. */
  :root {
    --desk: #F2F1EC;      /* warm desk paper */
    --ink: #1A1A1A;
    --ink-soft: #6B6B6B;
    --line: rgba(26, 26, 26, .14);
    --marker: #FFE45C;
    --paper: #FFFFFF;
    --hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .desk {
    height: 100%; display: grid; grid-template-columns: minmax(240px, 320px) auto; justify-content: center; align-items: center; gap: clamp(24px, 5vw, 72px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; box-sizing: border-box;
  }
  .notes { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .brand { font-family: var(--hand); font-weight: 700; font-size: 56px; line-height: .9; letter-spacing: -.01em; position: relative; width: max-content; }
  .brand::after { content: ""; position: absolute; left: -4px; right: -6px; bottom: 6px; height: 16px; background: var(--marker); z-index: -1; transform: rotate(-1.2deg); border-radius: 3px 6px 4px 5px; }
  .brand-wrap { isolation: isolate; }
  .lede { font-size: 14px; line-height: 1.55; color: var(--ink-soft); max-width: 34ch; margin: 0; }
  .journeys { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .journeys button {
    all: unset; cursor: pointer; display: grid; grid-template-columns: 22px 1fr; align-items: baseline; gap: 6px; padding: 7px 8px; border-radius: 8px;
    font-family: var(--hand); font-size: 24px; line-height: 1.05; color: var(--ink);
  }
  .journeys button small { font-family: var(--sans); font-size: 12px; color: var(--ink-soft); grid-column: 2; line-height: 1.35; }
  .journeys button:hover, .journeys button:focus-visible { background: rgba(255, 228, 92, .45); }
  .journeys button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .journeys .n { font-family: var(--sans); font-size: 12px; color: var(--ink-soft); }
  .foot { font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
  .foot button { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }

  .phone-slot { width: calc(412px * var(--s, 1)); height: calc(892px * var(--s, 1)); position: relative; }
  .phone {
    width: 412px; height: 892px; transform: scale(var(--s, 1)); transform-origin: top left; position: absolute; inset: 0 auto auto 0;
    background: var(--paper); border-radius: 46px; overflow: hidden; box-shadow: 0 0 0 10px #161616, 0 0 0 11px #3a3a3a, 0 30px 60px -20px rgba(0,0,0,.35);
  }
  .screen { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--paper); opacity: 0; pointer-events: none; transform: translateX(28px); }
  .screen.on { opacity: 1; pointer-events: auto; transform: none; transition: opacity .38s var(--ease), transform .45s var(--ease); z-index: 2; }
  .screen.from-left { transform: translateX(-28px); }
  .screen.fade { transform: none; }
  .screen.leaving { opacity: 0; transition: opacity .25s ease; z-index: 1; }

  /* Overlays drawn by the shell, inside the phone */
  .scrim { position: absolute; inset: 0; background: rgba(26,26,26,.32); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--paper); border-radius: 26px 26px 0 0; padding: 22px 24px 30px;
    transform: translateY(105%); transition: transform .45s var(--ease); display: flex; flex-direction: column; gap: 14px; pointer-events: none;
  }
  .sheet.on { transform: none; pointer-events: auto; }
  .sheet .grab { width: 44px; height: 4px; border-radius: 4px; background: var(--line); align-self: center; }
  .sheet h2 { margin: 0; font-family: var(--hand); font-size: 34px; line-height: 1; font-weight: 700; }
  .sheet p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink-soft); }
  .sheet .rows { display: flex; flex-direction: column; gap: 10px; }
  .sheet .row { font-family: var(--hand); font-size: 22px; display: flex; gap: 10px; align-items: baseline; }
  .sheet .row svg { flex: none; transform: translateY(3px); }
  .pill { all: unset; cursor: pointer; text-align: center; background: var(--ink); color: #fff; font-family: var(--hand); font-weight: 700; font-size: 24px; padding: 12px 22px; border-radius: 999px; }
  .pill:focus-visible, .link:focus-visible { outline: 2px solid var(--marker); outline-offset: 3px; }
  .link { all: unset; cursor: pointer; text-align: center; font-family: var(--hand); font-size: 21px; color: var(--ink); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
  .link.danger { color: #DC2626; }
  .finger { align-self: center; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; position: relative; }
  .finger::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--marker); opacity: .55; transform: scale(.2); transition: transform .5s var(--ease); }
  .finger.ok::before { transform: scale(1); }
  .finger svg { position: relative; }

  .toast {
    position: absolute; left: 50%; bottom: 96px; z-index: 30; transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    background: var(--ink); color: #fff; font-family: var(--hand); font-size: 21px; line-height: 1.15; padding: 10px 18px; border-radius: 18px;
    width: max-content; max-width: 330px; text-align: center; transition: opacity .3s ease, transform .4s var(--ease);
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  .menu-btn { display: none; }

  @media (max-width: 760px) {
    body { overflow: hidden; }
    .desk { display: block; padding: 0; height: 100%; }
    .notes { display: none; }
    .notes.open { display: flex; position: fixed; inset: 0; z-index: 50; background: var(--desk); overflow: auto;
      padding: calc(env(safe-area-inset-top, 0px) + 24px) max(20px, env(safe-area-inset-right, 0px)) 32px max(20px, env(safe-area-inset-left, 0px)); }
    .phone-slot { width: 100%; height: 100%; }
    .phone { width: 100%; height: 100%; transform: none; border-radius: 0; box-shadow: none; }
    .menu-btn { all: unset; display: block; position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 40; cursor: pointer;
      font-family: var(--hand); font-size: 18px; background: var(--marker); color: var(--ink); padding: 2px 10px; border-radius: 10px; transform: rotate(2deg); }
  }
  @media (max-width: 760px) { .notes .close { display: block; } }
  .notes .close { all: unset; display: none; cursor: pointer; font-family: var(--hand); font-size: 22px; text-decoration: underline; align-self: flex-start; }
  @media (prefers-reduced-motion: reduce) { .screen, .screen.on, .sheet, .toast, .scrim, .finger::before { transition: none !important; } }
</style>

<div class="desk">
  <aside class="notes" id="notes" aria-label="Journeys">
    <button class="close" id="closeNotes" type="button">close</button>
    <div class="brand-wrap"><div class="brand">burrow.</div></div>
    <p class="lede">A private notebook that understands your photos, conversations and words — and never lets them leave the phone. Tap through it like the real app, or jump to a journey.</p>
    <ul class="journeys" id="journeys">
      <li><button type="button" data-j="welcome"><span class="n">1</span>first run<small>welcome → you decide what Burrow sees → today</small></button></li>
      <li><button type="button" data-j="photos"><span class="n">2</span>tidy your photos<small>keep the best of each moment, let the rest go</small></button></li>
      <li><button type="button" data-j="sweep"><span class="n">3</span>private sweep<small>IDs, receipts, medical &amp; intimate photos → the vault</small></button></li>
      <li><button type="button" data-j="share"><span class="n">4</span>share a photo safely<small>from Android's share sheet: crop the card, drop the location</small></button></li>
      <li><button type="button" data-j="talks"><span class="n">5</span>record a talk<small>record → notes, who said what, to-dos</small></button></li>
      <li><button type="button" data-j="notes"><span class="n">6</span>read the notes, name a voice<small>"sounds like you?" → people learn</small></button></li>
      <li><button type="button" data-j="mask"><span class="n">7</span>mask a message<small>use any AI without giving it your details</small></button></li>
      <li><button type="button" data-j="privacy"><span class="n">8</span>see what happened<small>the on-device ledger and the switches</small></button></li>
    </ul>
    <p class="foot">Designed with Google Stitch · Version A, hand-drawn minimal · every model runs on the phone (Desert Ant Labs). <button type="button" id="restart">start over</button></p>
  </aside>

  <div class="phone-slot" id="slot">
    <div class="phone" id="phone">
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>
<button class="menu-btn" id="menuBtn" type="button">journeys</button>

<script>
(function () {
  var SCREENS = ["welcome","permissions","today","photos","moments","sweep","vault","share","talks","recording","notes","transcript","people","person","name-voice","mask","privacy"];
  var TABS = ["today","photos","talks","people"];
  var phone = document.getElementById('phone');
  var frames = {}, stack = [], current = null;

  // Shared state the screens display (data-bind) — changes as you use the prototype.
  var state = {
    "freeup": "2.4 GB", "private-line": "14 private photos in plain sight", "private-count": "— 14", "private-found": "14 things",
    "voices-line": "2 voices to name", "voices-count": "voices to name — 2", "spk3": "Speaker 3", "letgo-line": "176 to let go · 1.4 GB",
    "rec-timer": "00:00", "dl-pct": "62%", "reply-box": "paste the AI's reply here to put your details back"
  };
  var hides = [];
  var letgo = 176, rec = { secs: 0, paused: false, t: null };

  function frame(key) {
    if (frames[key]) return frames[key];
    var f = document.createElement('iframe');
    f.className = 'screen'; f.title = key; f.src = 'screens/' + key + '.html';
    f.setAttribute('loading', 'eager');
    phone.insertBefore(f, document.getElementById('scrim'));
    frames[key] = f;
    return f;
  }
  function push() {
    Object.keys(frames).forEach(function (k) {
      var w = frames[k].contentWindow; if (w) w.postMessage({ burrowState: state, hide: hides }, '*');
    });
  }
  function show(key, how) {
    if (key === current) return;
    var next = frame(key), prev = current && frames[current];
    next.classList.remove('from-left', 'fade', 'leaving', 'on');
    if (how === 'back') next.classList.add('from-left'); else if (how === 'tab') next.classList.add('fade');
    void next.offsetWidth;
    next.classList.add('on');
    if (prev) { prev.classList.remove('on'); prev.classList.add('leaving'); setTimeout(function () { prev.classList.remove('leaving'); }, 300); }
    current = key;
    try { history.replaceState(null, '', '#' + key); } catch (e) {}
    onEnter(key);
  }
  function go(key, opts) {
    opts = opts || {};
    if (opts.replace && stack.length) stack[stack.length - 1] = key; else stack.push(key);
    show(key, 'forward');
  }
  function back() {
    if (stack.length > 1) { stack.pop(); show(stack[stack.length - 1], 'back'); }
  }
  function tab(key) { stack = [key]; show(key, 'tab'); }
  function reset(start) { stack = []; hideSheet(); go(start || 'welcome'); }

  // ------------------------------------------------------------------ feedback
  var toastEl = document.getElementById('toast'), toastT;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 2200);
  }
  var sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
  function openSheet(html, onOpen) {
    sheet.innerHTML = '<div class="grab"></div>' + html;
    scrim.classList.add('on'); sheet.classList.add('on');
    var first = sheet.querySelector('button'); if (first) setTimeout(function () { first.focus({ preventScroll: true }); }, 50);
    if (onOpen) onOpen(sheet);
  }
  function hideSheet() { scrim.classList.remove('on'); sheet.classList.remove('on'); }
  scrim.addEventListener('click', hideSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideSheet(); });

  var TICK = '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5c1.6 1.3 2.7 2.6 3.8 4.2 2.4-4.6 5.4-8 9.2-10.9"/></svg>';
  var FINGER = '<svg width="58" height="58" viewBox="0 0 60 60" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"><path d="M18 22c3-6 9-9 15-8 7 1 12 7 12 15"/><path d="M14 31c0-4 1-7 3-10"/><path d="M45 34c0 6-1 11-3 15"/><path d="M22 30c1-5 5-8 10-7 5 1 7 5 7 10 0 5-1 10-3 14"/><path d="M29 30c1-2 4-2 5 0 1 3 0 9-2 15"/><path d="M24 36c0 4-1 8-3 11"/><path d="M19 41c-1 2-2 4-3 5"/></svg>';

  function fingerprint(title, then) {
    openSheet('<h2 id="sheetTitle">' + title + '</h2><p>Burrow locks private things with your fingerprint. The key never leaves this phone.</p>' +
      '<div class="finger" id="finger">' + FINGER + '</div><button class="pill" id="fpGo" type="button">touch the sensor</button><button class="link" id="fpNo" type="button">cancel</button>',
      function (s) {
        s.querySelector('#fpNo').onclick = hideSheet;
        s.querySelector('#fpGo').onclick = function () {
          s.querySelector('#finger').classList.add('ok');
          setTimeout(function () { hideSheet(); then(); }, 650);
        };
      });
  }
  function confirmSheet(title, body, yes, no, onYes, danger) {
    openSheet('<h2 id="sheetTitle">' + title + '</h2><p>' + body + '</p><button class="pill" id="cYes" type="button"' + (danger ? ' style="background:#DC2626"' : '') + '>' + yes + '</button><button class="link" id="cNo" type="button">' + no + '</button>',
      function (s) { s.querySelector('#cNo').onclick = hideSheet; s.querySelector('#cYes').onclick = function () { hideSheet(); onYes(); }; });
  }

  // ------------------------------------------------------------------ screen-specific behaviour
  function onEnter(key) {
    if (key === 'permissions') animateDownload();
    if (key === 'recording') startRec(); else stopRec(false);
  }
  var dl = 62, dlT;
  function animateDownload() {
    clearInterval(dlT);
    dlT = setInterval(function () {
      dl = Math.min(100, dl + 3); state['dl-pct'] = dl === 100 ? 'ready ✓' : dl + '%'; push();
      if (dl === 100) clearInterval(dlT);
    }, 180);
  }
  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
  function startRec() {
    rec.secs = 0; rec.paused = false; clearInterval(rec.t);
    state['rec-timer'] = fmt(0); push();
    rec.t = setInterval(function () { if (!rec.paused) { rec.secs++; state['rec-timer'] = fmt(rec.secs); push(); } }, 1000);
  }
  function stopRec() { clearInterval(rec.t); }

  var ACTS = {
    'sheet:privacy-how': function () {
      openSheet('<h2 id="sheetTitle">how it stays private</h2><div class="rows">' +
        '<div class="row">' + TICK + 'the AI runs on this phone, not on a server</div>' +
        '<div class="row">' + TICK + 'after a one-time download it works with no internet</div>' +
        '<div class="row">' + TICK + 'it only looks at what you allow, when you ask</div>' +
        '<div class="row">' + TICK + 'private things are locked with your fingerprint</div></div>' +
        '<button class="pill" id="ok" type="button">got it</button>', function (s) { s.querySelector('#ok').onclick = hideSheet; });
    },
    'check-again': function () { toast('checking 312 new photos… done — nothing new to tidy'); },
    'moment-delta': function (m) {
      letgo = Math.max(0, letgo + m.d);
      state['letgo-line'] = letgo + ' to let go · ' + (letgo * 1.4 / 176).toFixed(1) + ' GB'; push();
    },
    'let-go': function () {
      var gb = (letgo * 1.4 / 176);
      state.freeup = Math.max(0, 2.4 - gb).toFixed(1) + ' GB';
      push(); back(); toast(letgo + ' photos moved to the trash — recoverable for 30 days');
    },
    'to-vault': function () {
      fingerprint('move 14 photos to the vault?', function () {
        state['private-line'] = 'nothing private in plain sight ✓'; state['private-count'] = '— 0 ✓'; state['private-found'] = '0 things';
        push(); go('vault', { replace: true }); toast('14 photos moved to the vault — gone from your gallery');
      });
    },
    'lock': function () { back(); toast('vault locked'); },
    'export': function () {
      confirmSheet('export 23 photos?', 'Exported copies leave the vault and any app on the phone could read them.', 'export anyway', 'keep them locked', function () { toast('23 photos exported to Downloads'); });
    },
    'share-clean': function () { back(); toast('clean copy shared — card cropped out, location removed'); },
    'confirm:send-original': function () {
      confirmSheet('send the original?', 'The bank card and your home location go with it.', 'send the clean copy', 'send original anyway', function () { back(); toast('clean copy shared — card cropped out, location removed'); });
    },
    'pause': function () { rec.paused = !rec.paused; toast(rec.paused ? 'paused' : 'recording again'); },
    'stop': function () { stopRec(); back(); toast('kept · notes will be ready in about a minute'); },
    'play': function () { toast('▶ playing from 14:20 — tap any line to jump there'); },
    'me-yes': function () { nameSpeaker('Sam (you)'); toast('got it — Burrow will know your voice next time'); },
    'save-voice': function () { nameSpeaker('Sam (you)'); back(); toast('saved — Speaker 3 is you'); },
    'play-snippet': function () { toast('▶ “I can take the hiring plan and share it on Thursday.”'); },
    'share-masked': function () { back(); toast('shared — names and numbers replaced'); },
    'confirm:full-export': function () {
      confirmSheet('export with names?', 'The full transcript includes names and phone numbers.', 'export', 'cancel', function () { toast('transcript saved to Downloads'); });
    },
    'copy-masked': function () {
      var t = "Hi, I'm [NAME_1], card [CARD_1], call me on [PHONE_1] about my order at [ADDRESS_1].";
      try { navigator.clipboard.writeText(t).catch(function () {}); } catch (e) {}
      toast('copied — paste it into any AI');
    },
    'paste-reply': function () {
      state['reply-box'] = 'Thanks Sam Carter — your order to 12 Baker Street ships tomorrow. We\'ll text +44 7700 900123.'; push();
      toast('your details are back — only on this phone');
    },
    'confirm:forget-priya': function () {
      confirmSheet("forget Priya's voice?", 'Her voice signature is deleted from this phone. Your talks stay; her turns show as an unnamed speaker.', 'forget her voice', 'keep it', function () { back(); toast("Priya's voice is forgotten"); }, true);
    },
    'confirm:wipe': function () {
      confirmSheet('wipe everything?', 'Burrow forgets every voice, note and vault key it holds. Your photos stay in your gallery.', 'wipe everything', 'cancel', function () {
        resetState(); reset('welcome'); toast('Burrow is empty — nothing left behind');
      }, true);
    }
  };
  function nameSpeaker(name) {
    state.spk3 = name; state['voices-line'] = '1 voice to name'; state['voices-count'] = 'voices to name — 1';
    if (hides.indexOf('spk3-suggestion') < 0) hides.push('spk3-suggestion');
    push();
  }
  var INITIAL = JSON.stringify(state);
  function resetState() { state = JSON.parse(INITIAL); hides = []; letgo = 176; dl = 62; push(); }

  window.addEventListener('message', function (e) {
    var m = e.data || {}; if (!m.burrow) return;
    if (m.ready) { var f = frames[m.from]; if (f && f.contentWindow) f.contentWindow.postMessage({ burrowState: state, hide: hides }, '*'); return; }
    if (m.act) { if (ACTS[m.act]) ACTS[m.act](m); return; }
    if (m.back) return back();
    if (m.go) { if (m.tab && TABS.indexOf(m.tab) >= 0 && m.go === m.tab) return tab(m.go); return go(m.go, { replace: m.replace }); }
    if (m.tab) return tab(m.tab);
    if (m.toast) return toast(m.toast);
  });

  // ------------------------------------------------------------------ shell
  function fit() {
    if (window.innerWidth <= 760) { document.documentElement.style.removeProperty('--s'); return; }
    var s = Math.min(1, (window.innerHeight - 40) / 892);
    document.documentElement.style.setProperty('--s', s.toFixed(3));
  }
  window.addEventListener('resize', fit); fit();

  var notes = document.getElementById('notes');
  document.getElementById('menuBtn').onclick = function () { notes.classList.add('open'); };
  document.getElementById('closeNotes').onclick = function () { notes.classList.remove('open'); };
  document.getElementById('journeys').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-j]'); if (!b) return;
    notes.classList.remove('open');
    var j = b.dataset.j;
    if (j === 'welcome') { resetState(); return reset('welcome'); }
    if (j === 'share') { stack = ['today']; frame('today'); go('share'); return toast('opened from Android’s share sheet'); }
    if (TABS.indexOf(j) >= 0) return tab(j);
    stack = [j === 'sweep' ? 'photos' : j === 'notes' ? 'talks' : 'today']; frame(stack[0]); go(j);
  });
  document.getElementById('restart').onclick = function () { resetState(); reset('welcome'); };

  // Preload the first screens so the first taps feel instant.
  ['welcome', 'permissions', 'today'].forEach(frame);
  var start = (location.hash || '').slice(1);
  if (SCREENS.indexOf(start) >= 0 && start !== 'welcome') { stack = [TABS.indexOf(start) >= 0 ? start : 'today']; if (stack[0] !== start) stack.push(start); frame(stack[0]); show(start, 'tab'); }
  else go('welcome');
})();
</script>

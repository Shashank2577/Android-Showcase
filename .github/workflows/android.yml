name: Android build

# Every push builds an installable APK (Actions → this run → Artifacts).
# A tag like v3.8, or running this workflow by hand with a release tag, also
# publishes it as a GitHub release: the easiest way to download it on a phone.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to create and publish (e.g. v3.8); empty for just a build
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Signed with your release key when the ANDROID_KEYSTORE_* secrets exist,
      # otherwise with the vendor's public test key (app/showcase-test.jks), the
      # same key as PhoneDots: builds update in place and share models.
      - name: Build release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --no-daemon :basemodels:testDebugUnitTest assembleRelease

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          NAME="Burrow-$VERSION-${GITHUB_SHA::7}-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: burrow-apk
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release != ''
        with:
          tag_name: ${{ github.event.inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Burrow ${{ github.event.inputs.release || github.ref_name }}
          prerelease: true
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
          body: |
            Test build for arm64 Android phones (Android 11+).

            **Install:** download the APK on your phone, open it and allow installs from your browser. Signed with the vendor test key, like PhoneDots: later builds update in place, and the two apps share downloaded models. Builds before 3.8 used a different key: uninstall that one once.

            **Report a problem:** settings → logs → copy all, and paste it into the report.
